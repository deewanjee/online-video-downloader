services:
  streamvault:
    build: .
    environment:
      STREAMVAULT_PUBLIC: "true"
      STREAMVAULT_USERNAME: ${STREAMVAULT_USERNAME:-admin}
      STREAMVAULT_PASSWORD: ${STREAMVAULT_PASSWORD:?Set a strong STREAMVAULT_PASSWORD in .env}
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    expose:
      - "8000"
    volumes:
      - downloads:/data
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
  proxy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      STREAMVAULT_DOMAIN: ${STREAMVAULT_DOMAIN:?Set your domain in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - streamvault
    restart: unless-stopped
volumes:
  downloads:
  caddy_data:
  caddy_config:
